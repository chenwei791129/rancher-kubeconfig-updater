name: Go Test

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  # Shared workflow: the pinned checkout/setup-go SHAs are maintained in
  # chenwei791129/.github for every repository. It downloads modules, caches
  # them through setup-go and always runs with -count=1.
  test:
    permissions:
      contents: read
    uses: chenwei791129/.github/.github/workflows/go-test.yml@main
    with:
      test-args: -v ./...
